<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="560" y2="250"><stop stop-color="#FCFBFF"/><stop offset=".55" stop-color="#F8F6FF"/><stop offset="1" stop-color="#F3F2FF"/></linearGradient>
  <radialGradient id="a" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(475 30) rotate(145) scale(210 155)"><stop stop-color="#A78BFA" stop-opacity=".20"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <radialGradient id="b" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 245) rotate(-55) scale(230 150)"><stop stop-color="#2563EB" stop-opacity=".10"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
  <linearGradient id="shine" x1="-180" y1="0" x2="60" y2="250"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".50" stop-color="#FFFFFF" stop-opacity=".88"/><stop offset=".58" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-80" y="-80" width="720" height="410"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="clip"><rect x="8" y="8" width="544" height="234" rx="28"/></clipPath>
</defs>
<rect x="8" y="8" width="544" height="234" rx="28" fill="url(#bg)" stroke="#D0D7DE"/>
<g clip-path="url(#clip)">
  <ellipse cx="472" cy="34" rx="180" ry="120" fill="url(#a)" filter="url(#blur)"><animate attributeName="cx" values="455;500;455" dur="9.6s" repeatCount="indefinite"/><animate attributeName="cy" values="28;58;28" dur="7.8s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="95" cy="235" rx="190" ry="105" fill="url(#b)" filter="url(#blur)"><animate attributeName="cx" values="80;130;80" dur="11.6s" repeatCount="indefinite"/></ellipse>
  <rect x="-220" y="-30" width="170" height="330" transform="rotate(16 0 0)" fill="url(#shine)" opacity=".52"><animate attributeName="x" values="-220;720" dur="8.8s" repeatCount="indefinite"/></rect>
</g>
<path d="M35 24H210" stroke="#8C959F" stroke-opacity=".28" stroke-linecap="round"/>
<circle cx="514" cy="38" r="5" fill="#8B5CF6"/>
<circle cx="514" cy="38" r="5" fill="#8B5CF6" opacity=".35" filter="url(#glow)"><animate attributeName="r" values="5;9;5" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;.05;.35" dur="2.5s" repeatCount="indefinite"/></circle>
<g font-family="Segoe UI, Inter, Arial, sans-serif">
  <text x="36" y="52" fill="#6E7781" font-size="11.5" font-weight="700" letter-spacing="2.4">AI · DEVELOPER TOOLING</text>
  <text x="36" y="91" fill="#1F2328" font-size="26" font-weight="720">Coding Tools MCP</text>
  <text x="36" y="126" fill="#424A53" font-size="14.2">Persistent local development workspace exposed to AI agents through MCP.</text>
  <text x="36" y="150" fill="#6E7781" font-size="13.4">Files, commands, Git state, remote access and cross-session context.</text>
  <g fill="#FFFFFF" stroke="#D8DEE4"><rect x="36" y="192" width="66" height="26" rx="13"/><rect x="110" y="192" width="66" height="26" rx="13"/><rect x="184" y="192" width="66" height="26" rx="13"/><rect x="258" y="192" width="66" height="26" rx="13"/></g>
  <g fill="#57606A" font-size="11.5" font-weight="600"><text x="48" y="209">Rust</text><text x="122" y="209">Tauri</text><text x="196" y="209">MCP</text><text x="270" y="209">Git</text></g>
  <text x="486" y="209" fill="#7C3AED" font-size="12.5" font-weight="700">OPEN ↗</text>
</g>
</svg>