  <rect x="8.5" y="8.5" width="543" height="233" rx="27.5" fill="none" stroke="url(#edge)"/><path d="M35 24H210" stroke="#FFFFFF" stroke-opacity=".16" stroke-linecap="round"/>
  <circle cx="514" cy="38" r="5" fill="#34D399"/><circle cx="514" cy="38" r="5" fill="#34D399" opacity=".55" filter="url(#glow)"><animate attributeName="r" values="5;9;5" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;.08;.55" dur="2.2s" repeatCount="indefinite"/></circle>
  <text x="36" y="52" fill="#91A0B2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.4">WINDOWS · UTILITY</text><text x="36" y="91" fill="#F6F8FA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="720">Wireless Battery Monitor</text><text x="36" y="126" fill="#C7D0DA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.1">Tray utility for wireless mice, keyboards and compatible BLE devices.</text><text x="36" y="150" fill="#8D99A8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.3">Battery level, charging state, low-battery alerts and multi-device monitoring.</text>
