<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B12"/>
      <stop offset="0.45" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#08111D"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(985 92) rotate(141) scale(465 300)">
      <stop stop-color="#2F81F7" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(775 290) rotate(-20) scale(300 160)">
      <stop stop-color="#39C5CF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#39C5CF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="90" y1="0" x2="595" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.52" stop-color="#39C5CF"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentSweep" x1="0" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#9BE9F2" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#E6F7FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#39C5CF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="lineGlow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="accentClip">
      <rect x="90" y="218" width="525" height="10" rx="5"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="388" rx="24" fill="url(#bg)" stroke="#21262D"/>
  <rect x="1" y="1" width="1198" height="388" rx="24" fill="url(#blueGlow)"/>
  <rect x="1" y="1" width="1198" height="388" rx="24" fill="url(#cyanGlow)"/>

  <g opacity="0.13" stroke="#8B949E" stroke-width="1">
    <path d="M0 65H1200M0 130H1200M0 195H1200M0 260H1200M0 325H1200"/>
    <path d="M120 0V390M240 0V390M360 0V390M480 0V390M600 0V390M720 0V390M840 0V390M960 0V390M1080 0V390"/>
  </g>

  <rect x="1" y="-80" width="1198" height="80" fill="url(#scan)" opacity="0.9">
    <animate attributeName="y" values="-80;390" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.78">
    <path d="M760 288L816 234L873 254L930 171L995 202L1062 119L1120 145" stroke="#30363D" stroke-width="1.3"/>
    <path d="M760 288L816 234L873 254L930 171L995 202L1062 119L1120 145" stroke="#58A6FF" stroke-width="1.3" stroke-dasharray="5 10" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="0;-60" dur="3s" repeatCount="indefinite"/>
    </path>

    <g filter="url(#nodeGlow)">
      <circle cx="760" cy="288" r="4" fill="#39C5CF">
        <animate attributeName="r" values="3;5;3" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="816" cy="234" r="4" fill="#58A6FF">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="873" cy="254" r="3" fill="#8B949E"/>
      <circle cx="930" cy="171" r="4" fill="#58A6FF">
        <animate attributeName="r" values="3;6;3" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="995" cy="202" r="3" fill="#8B949E"/>
      <circle cx="1062" cy="119" r="5" fill="#39C5CF">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="145" r="3" fill="#58A6FF"/>
    </g>
  </g>

  <circle cx="1062" cy="119" r="28" fill="#39C5CF" opacity="0.08" filter="url(#softGlow)">
    <animate attributeName="r" values="20;38;20" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="88" y="93" fill="#58A6FF" font-size="14" font-weight="700" letter-spacing="3">PROFILE.NODE</text>
    <text x="86" y="157" fill="#F0F6FC" font-size="58" font-weight="750" letter-spacing="1">ZGMFX01A</text>
    <text x="90" y="198" fill="#8B949E" font-size="17" font-weight="600" letter-spacing="3">BACKEND DEVELOPER  ·  INDEPENDENT BUILDER</text>

    <rect x="90" y="222" width="525" height="2" rx="1" fill="url(#accent)" opacity="0.9"/>
    <g clip-path="url(#accentClip)" filter="url(#lineGlow)">
      <rect x="-70" y="220" width="150" height="6" rx="3" fill="url(#accentSweep)">
        <animate attributeName="x" values="-70;630" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <circle cx="90" cy="223" r="2.3" fill="#58A6FF" opacity="0.5">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <text x="90" y="264" fill="#C9D1D9" font-size="18">Source-first software</text>
    <text x="276" y="264" fill="#484F58" font-size="18">/</text>
    <text x="295" y="264" fill="#C9D1D9" font-size="18">Local AI tooling</text>
    <text x="445" y="264" fill="#484F58" font-size="18">/</text>
    <text x="464" y="264" fill="#C9D1D9" font-size="18">Practical systems</text>

    <rect x="90" y="301" width="158" height="34" rx="17" fill="#0D1823" stroke="#1F6FEB" stroke-opacity="0.55"/>
    <circle cx="110" cy="318" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="124" y="323" fill="#8B949E" font-size="12" font-weight="700" letter-spacing="1.2">STATUS: BUILDING</text>

    <rect x="262" y="301" width="118" height="34" rx="17" fill="#11161D" stroke="#30363D"/>
    <text x="281" y="323" fill="#8B949E" font-size="12" font-weight="600">JAVA / SPRING</text>

    <rect x="394" y="301" width="112" height="34" rx="17" fill="#11161D" stroke="#30363D"/>
    <text x="414" y="323" fill="#8B949E" font-size="12" font-weight="600">ANDROID / AI</text>

    <g opacity="0.86">
      <text x="827" y="325" fill="#484F58" font-size="12" letter-spacing="1.6">SIGNAL</text>
      <rect x="884" y="315" width="12" height="10" rx="2" fill="#1F6FEB" opacity="0.35"/>
      <rect x="901" y="309" width="12" height="16" rx="2" fill="#2F81F7" opacity="0.55"/>
      <rect x="918" y="302" width="12" height="23" rx="2" fill="#58A6FF" opacity="0.8"/>
      <rect x="935" y="294" width="12" height="31" rx="2" fill="#39C5CF">
        <animate attributeName="height" values="31;18;31" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="294;307;294" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>